[project]
name = "jde-mcp-server"
version = "0.1.0"
description = "JDE MCP server -- Section 7.3 MVP tool set for the JDE AI-Driven Change Factory"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[tool.setuptools]
packages = ["jde_mcp_server"]
