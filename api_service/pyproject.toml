[project]
name = "jde-api-service"
version = "0.1.0"
description = "REST API boundary for the JDE Change Factory frontend. Sibling application to mcp_server; imports it read-only and never modifies its behaviour."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    # Drives the EXISTING .claude/agents/*.md subagents via Claude Code --
    # a different product from the Claude API SDK. Requires an isolated
    # venv: its transitive `mcp` dependency conflicts with the system
    # cryptography/cffi install that the real MCP server subprocess
    # (spawned by .mcp.json, which we cannot modify) depends on. See
    # services/orchestration_driver.py.
    "claude-agent-sdk>=0.1.0",
    # services/jira_gateway.py's real Jira calls (live test-connection,
    # live sync) -- not just a test dependency (fastapi.testclient also
    # needs it, which is why it lived under the test extra before).
    # Without this here, a clean production install has no live gateway
    # the moment a customer's Jira credentials are configured.
    "httpx>=0.27.0",
    # services/auth_service.py's password hashing -- an established,
    # audited library, not hand-rolled crypto (see that module's own
    # docstring).
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.setuptools]
packages = ["jde_api_service"]
