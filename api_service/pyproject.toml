[project]
name = "jde-api-service"
version = "0.1.0"
description = "REST API boundary for the JDE Change Factory frontend -- Phase 1 (read-only + direct-entry intake). Sibling application to mcp_server; imports it read-only and never modifies its behaviour."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["jde_api_service"]
