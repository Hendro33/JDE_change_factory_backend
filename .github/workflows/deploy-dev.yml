name: Deploy to Azure DEV

# Every push to the dev branch builds the backend image, publishes it to the
# GitHub container registry and rolls it out to Jade DEV on Azure Container
# Apps (resource group jade-dev). main is the stable baseline and is never
# deployed from here.
#
# No secret is stored for this: GitHub signs in to Azure with a short-lived
# federated token (OIDC) for an identity that may only change the jade-dev
# resource group, and only from this repository's dev branch. The IDs below
# are repository variables, not secrets. The app's own secrets live in the
# Container App, never in GitHub.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hendro33/jde_change_factory_backend

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:dev-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out to the Container App
        run: |
          az containerapp update -g jade-dev -n jade-dev-api \
            --image "$IMAGE:dev-$GITHUB_SHA" --revision-suffix "g${GITHUB_SHA::7}" -o none

      - name: Wait for the new revision to be healthy
        run: |
          fqdn=$(az containerapp show -g jade-dev -n jade-dev-api --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 40); do
            if curl -fsS "https://$fqdn/health" >/dev/null; then echo "healthy"; exit 0; fi
            sleep 15
          done
          echo "the new revision did not become healthy" >&2
          exit 1
