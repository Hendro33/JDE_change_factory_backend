name: Diagnose Azure DEV

# Read-only: reports how Jade DEV is wired (addresses, custom domains, DNS,
# CORS/cookie settings, whether a setup account is configured) without
# changing anything in Azure. Secret values are never printed, only whether
# they are set. Runs by hand, or when this file changes on dev.
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: [.github/workflows/diagnose-dev.yml]

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Backend Container App
        continue-on-error: true
        run: |
          az containerapp show -g jade-dev -n jade-dev-api --query "{fqdn:properties.configuration.ingress.fqdn, customDomains:properties.configuration.ingress.customDomains, domainVerificationId:properties.customDomainVerificationId, image:properties.template.containers[0].image, running:properties.runningStatus}" -o json
          echo "--- settings (secret values hidden) ---"
          az containerapp show -g jade-dev -n jade-dev-api --query "properties.template.containers[0].env" -o json | python3 -c '
          import json, sys
          shown = {"JDE_API_ALLOWED_ORIGINS", "JDE_PUBLIC_URL", "JDE_COOKIE_DOMAIN", "JDE_COOKIE_SAMESITE", "JDE_COOKIE_SECURE",
                   "JDE_TRUST_PROXY_HEADERS", "JDE_BOOTSTRAP_ADMIN_EMAIL", "JDE_BOOTSTRAP_CUSTOMER_NAME", "JDE_VALIDATION_WORKER"}
          for e in json.load(sys.stdin):
              value = e.get("value") if e["name"] in shown else ("<secret ref>" if e.get("secretRef") else "<set>")
              name = e["name"]
              print(name, "=", value)'

      - name: Revisions, replicas, environment and database state
        continue-on-error: true
        run: |
          echo "--- app state ---"
          az containerapp show -g jade-dev -n jade-dev-api --query "{provisioning:properties.provisioningState, running:properties.runningStatus, latestRevision:properties.latestRevisionName, readyRevision:properties.latestReadyRevisionName, revisionMode:properties.configuration.activeRevisionsMode, minReplicas:properties.template.scale.minReplicas, maxReplicas:properties.template.scale.maxReplicas, ingressEnabled:properties.configuration.ingress!=null, external:properties.configuration.ingress.external, targetPort:properties.configuration.ingress.targetPort, traffic:properties.configuration.ingress.traffic}" -o json || true
          echo "--- revisions ---"
          az containerapp revision list -g jade-dev -n jade-dev-api --all --query "[].{name:name, active:properties.active, running:properties.runningState, health:properties.healthState, provisioning:properties.provisioningState, replicas:properties.replicas, traffic:properties.trafficWeight, created:properties.createdTime}" -o table || true
          echo "--- replicas of the latest revision ---"
          rev=$(az containerapp show -g jade-dev -n jade-dev-api --query properties.latestRevisionName -o tsv)
          az containerapp replica list -g jade-dev -n jade-dev-api --revision "$rev" --query "[].{name:name, state:properties.runningState, reason:properties.runningStateDetails}" -o table || true
          echo "--- managed environment ---"
          az containerapp env list -g jade-dev --query "[].{name:name, provisioning:properties.provisioningState}" -o table || true
          echo "--- all resources in the group (type, state) ---"
          az resource list -g jade-dev --query "[].{name:name, type:type}" -o table || true
          echo "--- PostgreSQL servers ---"
          az postgres flexible-server list -g jade-dev --query "[].{name:name, state:state, version:version}" -o table || true
          echo "--- subscription ---"
          az account show --query "{name:name, state:state}" -o json || true
          echo "--- last system events (no secrets) ---"
          az containerapp logs show -g jade-dev -n jade-dev-api --type system --tail 40 --format text 2>&1 | tail -40 || true
          echo "--- last console lines ---"
          az containerapp logs show -g jade-dev -n jade-dev-api --type console --tail 40 --format text 2>&1 | grep -viE "password|secret|token|key=" | tail -40 || true

      - name: Where the backend's secrets are stored (names only, never values)
        continue-on-error: true
        run: |
          az containerapp secret list -g jade-dev -n jade-dev-api --query "[].{name:name, keyVaultUrl:keyVaultUrl, identity:identity}" -o table
          echo "--- which secret each setting uses ---"
          az containerapp show -g jade-dev -n jade-dev-api --query "properties.template.containers[0].env[?secretRef].{setting:name, secret:secretRef}" -o table
          echo "--- Key Vaults in the resource group ---"
          az keyvault list -g jade-dev --query "[].{name:name, url:properties.vaultUri, rbac:properties.enableRbacAuthorization}" -o table || true

      - name: Frontend Static Web App
        continue-on-error: true
        run: |
          az staticwebapp show -g jade-dev -n jade-dev-web --query "{defaultHostname:defaultHostname, customDomains:customDomains}" -o json
          az staticwebapp hostname list -g jade-dev -n jade-dev-web -o table || true

      - name: Reachability from the internet
        continue-on-error: true
        env:
          API_URL: ${{ vars.JADE_DEV_API_URL }}
        run: |
          fqdn=$(az containerapp show -g jade-dev -n jade-dev-api --query properties.configuration.ingress.fqdn -o tsv)
          web=$(az staticwebapp show -g jade-dev -n jade-dev-web --query defaultHostname -o tsv)
          API_URL="${API_URL:-https://api.jade-dev.consultiq.nl}"
          host=$(echo "$API_URL" | sed -E 's#https?://([^/]+).*#\1#')
          echo "Frontend is built against: $API_URL"
          echo "--- DNS for $host ---"; dig +short CNAME "$host"; dig +short A "$host"; dig +short TXT "asuid.$host"
          for url in "https://$fqdn/health" "$API_URL/health"; do
            echo "--- GET $url ---"; curl -sS -m 20 -o /dev/null -w "HTTP %{http_code}\n" "$url" || true
          done
          for origin in "https://$web" "https://jade-dev.consultiq.nl"; do
            echo "--- CORS preflight from $origin to $API_URL/auth/login ---"
            curl -sS -m 20 -o /dev/null -D - -X OPTIONS "$API_URL/auth/login" -H "Origin: $origin" \
              -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" \
              | grep -iE "^HTTP|access-control-allow-(origin|credentials)" || echo "(no response)"
          done
